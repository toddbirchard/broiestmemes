# /etc/nginx/sites-available/broiestmemes
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/broiestmemes
#   sudo ln -sfn /etc/nginx/sites-available/broiestmemes /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default        # frees :80 / :443
#   sudo nginx -t && sudo systemctl reload nginx
#
# This file is HTTP-only on purpose. Run certbot afterwards and it will add the
# TLS server block, the HTTP->HTTPS redirect, and a renewal timer, editing this
# file in place:
#
#   sudo certbot --nginx -d broiestmemes.com -d www.broiestmemes.com
#
# Do that GREY-CLOUDED (Cloudflare proxy off) so the ACME challenge reaches the
# origin directly. Once a cert is issued, orange-cloud and set Cloudflare's SSL
# mode to Full (strict).

upstream broiestmemes_app {
    server 127.0.0.1:3000;
    # Reuse connections to Node rather than opening one per request. Requires
    # proxy_http_version 1.1 and a cleared Connection header, both set below.
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name broiestmemes.com www.broiestmemes.com;

    # Next already gzips nothing itself; compress text responses here. Images and
    # video are served from GCS, not through nginx, so this list is deliberately short.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/rss+xml application/xml image/svg+xml;

    # Only /api/download streams anything large (up to a 54MB GIF). Buffering that
    # to a temp file on disk adds latency and disk churn for no benefit, so stream
    # it straight through and allow a generous read timeout.
    location /api/download/ {
        proxy_pass http://broiestmemes_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://broiestmemes_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Next builds absolute URLs (OG tags, redirects) from this. Without it
        # every canonical and og:url comes out as http:// behind TLS termination.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # /_next/static/* deliberately has no cache directives here — the Next server
    # already sends `Cache-Control: public, max-age=31536000, immutable` on those
    # content-hashed assets. Adding add_header would emit a duplicate header.

    access_log /var/log/nginx/broiestmemes.access.log;
    error_log  /var/log/nginx/broiestmemes.error.log;
}
